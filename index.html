<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>超8 · 去水印下载</title>
<style>
  /* ── 基礎 ── */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root {
    --amber: #f59e0b;
    --amber-dim: #b45309;
    --ember: #dc2626;
    --film: #1a1410;
    --reel: #120e0a;
    --cream: #faf3e8;
    --warm: #e8d5b7;
    --muted: #8a7f6e;
    --glass: rgba(250, 243, 232, 0.05);
    --glass2: rgba(250, 243, 232, 0.08);
    --radius: 0;
    --border: 1px solid rgba(250, 243, 232, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--film);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px),
      radial-gradient(ellipse at 30% 20%, rgba(245,158,11,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(220,38,38,0.04) 0%, transparent 50%);
  }
  .container {
    width: 100%;
    max-width: 480px;
    padding: 20px 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ── 頂部品牌 ── */
  .brand {
    padding: 40px 0 28px;
    text-align: center;
    position: relative;
  }
  .brand::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
  }
  .brand-symbol {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .brand-symbol .circle {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--amber);
    opacity: 0.6;
  }
  .brand-symbol .circle:nth-child(2) { background: var(--ember); opacity: 0.8; }
  .brand h1 {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    color: var(--cream);
    text-shadow: 0 2px 20px rgba(245,158,11,0.15);
  }
  .brand h1 span {
    color: var(--amber);
  }
  .brand .sub {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
    font-weight: 500;
  }
  .brand .sub span {
    color: var(--amber);
    letter-spacing: 0;
  }

  /* ── 膠捲裝飾條 ── */
  .film-strip {
    display: flex;
    gap: 4px;
    justify-content: center;
    padding: 12px 0;
    opacity: 0.15;
  }
  .film-strip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cream);
  }
  .film-strip .dot:nth-child(odd) { background: var(--amber); }

  /* ── 輸入區 ── */
  .input-block {
    position: relative;
  }
  .input-block .label-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .input-block .label-line span {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--muted);
    font-weight: 600;
  }
  .input-block .label-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(250,243,232,0.15), transparent);
  }
  .input-group {
    display: flex;
    gap: 0;
    border: 1px solid rgba(250,243,232,0.12);
    background: var(--glass);
    transition: border-color 0.3s;
  }
  .input-group:focus-within {
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(245,158,11,0.08);
  }
  .input-group input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 14px 16px;
    color: var(--cream);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    letter-spacing: 0.3px;
  }
  .input-group input::placeholder {
    color: var(--muted);
    opacity: 0.5;
    letter-spacing: 0;
  }
  .input-group button {
    background: transparent;
    border: none;
    border-left: 1px solid rgba(250,243,232,0.12);
    padding: 14px 20px;
    color: var(--amber);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s;
  }
  .input-group button:hover {
    background: rgba(245,158,11,0.1);
    color: #fbbf24;
  }
  .input-group button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ── 狀態 ── */
  .toast {
    display: none;
    padding: 14px 16px;
    margin-top: 12px;
    font-size: 13px;
    letter-spacing: 0.3px;
    border: 1px solid rgba(250,243,232,0.08);
    position: relative;
  }
  .toast.show { display: block; }
  .toast.error {
    border-color: rgba(220,38,38,0.3);
    color: #fca5a5;
    background: rgba(220,38,38,0.06);
  }
  .toast.loading {
    border-color: rgba(245,158,11,0.2);
    color: var(--warm);
  }
  .toast .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1.5px solid rgba(245,158,11,0.2);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 結果卡 ── */
  .reel-card {
    display: none;
    margin-top: 16px;
    border: 1px solid rgba(250,243,232,0.1);
    background: var(--glass);
    overflow: hidden;
  }
  .reel-card.show { display: block; }

  .reel-card .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--reel);
    overflow: hidden;
    cursor: pointer;
  }
  .reel-card .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.9) contrast(1.05);
    transition: transform 0.5s ease, filter 0.5s;
  }
  .reel-card .frame:hover img {
    transform: scale(1.04);
    filter: saturate(1.1) contrast(1.1) brightness(1.05);
  }
  .reel-card .frame .sprocket {
    position: absolute;
    inset: 0;
    border: 8px solid var(--film);
    pointer-events: none;
  }
  .reel-card .frame .sprocket::before,
  .reel-card .frame .sprocket::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 4px;
    background: repeating-linear-gradient(90deg,
      transparent 0, transparent 6px,
      rgba(250,243,232,0.06) 6px, rgba(250,243,232,0.06) 10px);
  }
  .reel-card .frame .sprocket::before { top: 0; }
  .reel-card .frame .sprocket::after { bottom: 0; }

  .reel-card .frame .hover-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(18,14,10,0.4);
    opacity: 0;
    transition: opacity 0.35s;
  }
  .reel-card .frame:hover .hover-hint { opacity: 1; }
  .reel-card .frame .hover-hint svg {
    width: 48px;
    height: 48px;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.6));
  }

  /* ── 資訊區 ── */
  .reel-card .details {
    padding: 18px 20px 20px;
    border-top: 1px solid rgba(250,243,232,0.06);
  }
  .reel-card .details .title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--cream);
  }
  .reel-card .details .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .reel-card .details .meta .tag {
    padding: 2px 8px;
    border: 1px solid rgba(250,243,232,0.08);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── 畫質選擇 ── */
  .format-selector {
    margin-top: 14px;
  }
  .format-selector .fmt-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .fmt-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .fmt-btn {
    flex: 1;
    min-width: 60px;
    padding: 10px 8px;
    border: 1px solid rgba(250,243,232,0.1);
    background: transparent;
    color: var(--warm);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .fmt-btn:hover {
    border-color: rgba(245,158,11,0.3);
    background: rgba(245,158,11,0.05);
  }
  .fmt-btn.active {
    border-color: var(--amber);
    background: rgba(245,158,11,0.1);
    color: var(--amber);
  }
  .fmt-btn .fmt-sub {
    display: block;
    font-size: 9px;
    font-weight: 400;
    opacity: 0.4;
    margin-top: 3px;
    letter-spacing: 0;
  }

  /* ── 下載按鈕 ── */
  .dl-btn-wrap {
    margin-top: 14px;
    position: relative;
  }
  .dl-btn {
    width: 100%;
    padding: 14px;
    border: none;
    background: var(--amber);
    color: #120e0a;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .dl-btn:hover {
    background: #fbbf24;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(245,158,11,0.2);
  }
  .dl-btn:active {
    transform: translateY(0);
  }
  .dl-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }
  .dl-note {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
    opacity: 0.6;
    letter-spacing: 0.3px;
  }

  /* ── 底部 ── */
  .footer {
    margin-top: auto;
    padding: 32px 0 16px;
    text-align: center;
  }
  .footer .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    font-weight: 500;
    text-transform: uppercase;
    opacity: 0.4;
  }
  .footer .tagline span { color: var(--amber); opacity: 0.6; }
  .footer .badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }
  .footer .badges .badge {
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid rgba(250,243,232,0.06);
    color: var(--muted);
    opacity: 0.5;
  }

  /* ── 打孔裝飾 ── */
  .perf {
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
    opacity: 0.08;
    margin: 2px 0;
  }
  .perf .hole {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--cream);
  }

  /* ── RWD ── */
  @media (max-width: 420px) {
    .brand { padding: 28px 0 20px; }
    .brand h1 { font-size: 40px; }
    .input-group input { padding: 12px 14px; font-size: 13px; }
    .input-group button { padding: 12px 16px; font-size: 12px; }
    .reel-card .details { padding: 14px 16px 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- 打孔裝飾條 -->
  <div class="perf"><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div></div>

  <!-- Brand -->
  <div class="brand">
    <div class="brand-symbol">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
    <h1>超<span>8</span></h1>
    <div class="sub">watermark · <span>free</span></div>
  </div>

  <!-- Film strip dots -->
  <div class="film-strip">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <!-- Input -->
  <div class="input-block">
    <div class="label-line"><span>paste link</span></div>
    <div class="input-group">
      <input id="urlInput" type="url" placeholder="贴上抖音 / YouTube 连结" autocomplete="off" enterkeyhint="go">
      <button id="parseBtn">parse</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Result Card -->
  <div class="reel-card" id="reelCard">
    <div class="frame" id="frame">
      <img id="thumbnail" src="" alt="">
      <div class="sprocket"></div>
      <div class="hover-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(250,243,232,0.8)" stroke-width="1.5">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
    </div>
    <div class="details">
      <div class="title" id="videoTitle"></div>
      <div class="meta">
        <span id="videoUploader"></span>
        <span id="videoDuration"></span>
        <span class="tag" id="videoPlatform"></span>
      </div>
      <div class="format-selector" id="formatSelector">
        <div class="fmt-label">quality</div>
        <div class="fmt-grid" id="fmtGrid"></div>
      </div>
      <div class="dl-btn-wrap">
        <button class="dl-btn" id="dlBtn">
          <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v4h3.66V9h3.84L12 2z" transform="rotate(180,12,12)"/></svg>
          download
        </button>
        <div class="dl-note" id="dlNote"></div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="tagline">zero server load · direct <span>cdn</span></div>
    <div class="badges">
      <div class="badge">douyin</div>
      <div class="badge">youtube</div>
    </div>
  </div>

  <!-- 底部打孔 -->
  <div class="perf"><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div></div>
</div>

<script>
// ── DOM ──
const urlInput = document.getElementById('urlInput');
const parseBtn = document.getElementById('parseBtn');
const toast = document.getElementById('toast');
const reelCard = document.getElementById('reelCard');
const thumbnail = document.getElementById('thumbnail');
const frame = document.getElementById('frame');
const videoTitle = document.getElementById('videoTitle');
const videoUploader = document.getElementById('videoUploader');
const videoDuration = document.getElementById('videoDuration');
const videoPlatform = document.getElementById('videoPlatform');
const fmtGrid = document.getElementById('fmtGrid');
const formatSelector = document.getElementById('formatSelector');
const dlBtn = document.getElementById('dlBtn');
const dlNote = document.getElementById('dlNote');

let currentData = null;
let currentFmt = null;

// 部署到 GitHub Pages 時指向 Worker API
const API = window.location.origin.includes('github.io')
  ? 'https://chao8-api.a42599.workers.dev'
  : window.location.origin;

// ── Toast ──
function showToast(msg, type = '') {
  toast.textContent = msg;
  toast.className = 'toast show' + (type ? ' ' + type : '');
}
function hideToast() { toast.className = 'toast'; }
function showLoading() {
  toast.innerHTML = '<span class="spinner"></span>parsing...';
  toast.className = 'toast show loading';
}

function secondsToTime(s) {
  if (!s) return '';
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

// ── Parse ──
async function parseVideo() {
  let url = urlInput.value.trim();
  if (!url) {
    showToast('please paste a video link', 'error');
    return;
  }
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
    urlInput.value = url;
  }

  hideToast();
  showLoading();
  parseBtn.disabled = true;
  reelCard.classList.remove('show');

  try {
    const r = await fetch(`${API}/api/video-info?url=${encodeURIComponent(url)}`);
    const data = await r.json();

    if (!data.has_video || !data.formats || data.formats.length === 0) {
      showToast(data._note || 'parse failed — check the link', 'error');
      parseBtn.disabled = false;
      return;
    }

    currentData = data;
    renderCard(data);
  } catch (err) {
    showToast('network error — try again', 'error');
  }

  parseBtn.disabled = false;
}

// ── Render ──
function renderCard(data) {
  // Thumb
  if (data.thumbnail) {
    thumbnail.src = data.thumbnail;
    thumbnail.style.display = 'block';
  } else {
    thumbnail.style.display = 'none';
  }

  videoTitle.textContent = data.title || 'untitled';
  videoUploader.textContent = data.uploader || '';
  videoDuration.textContent = secondsToTime(data.duration) ? secondsToTime(data.duration) : '';
  videoPlatform.textContent = data.platform || '';

  // Formats
  fmtGrid.innerHTML = '';
  const fmts = data.formats || [];
  if (fmts.length === 0) {
    formatSelector.style.display = 'none';
    currentFmt = { cdn_url: data.cdn_url || '', single: true };
  } else {
    formatSelector.style.display = 'block';
    fmts.forEach((f, i) => {
      const btn = document.createElement('button');
      btn.className = 'fmt-btn' + (i === 0 ? ' active' : '');
      btn.innerHTML = f.label;
      if (!f.single) {
        btn.innerHTML += '<span class="fmt-sub">merge</span>';
      }
      btn.dataset.idx = i;
      btn.addEventListener('click', () => selectFmt(i));
      fmtGrid.appendChild(btn);
    });
    selectFmt(0);
  }

  // HD note
  const hasHi = fmts.some(f => f.height >= 1080 && !f.single);
  dlNote.textContent = hasHi ? '1080p+ is video-only — use 720p for one-click' : '';

  // Click frame to download
  frame.onclick = () => download();

  reelCard.classList.add('show');
  hideToast();
}

function selectFmt(idx) {
  const btns = fmtGrid.querySelectorAll('.fmt-btn');
  btns.forEach((b, i) => b.classList.toggle('active', i === idx));
  currentFmt = currentData.formats[idx];
}

// ── Download ──
async function download() {
  if (!currentFmt || !currentFmt.cdn_url) {
    showToast('no download url available', 'error');
    return;
  }

  const cdn = currentFmt.cdn_url;
  const single = currentFmt.single !== false;
  const name = (currentData.title || 'video').replace(/[^\w\u4e00-\u9fff\-]/g, '_') + '.mp4';

  if (!single) {
    showToast('use 720p or lower for instant download', 'error');
    return;
  }

  // iOS share
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS && navigator.share) {
    try {
      const resp = await fetch(cdn, { mode: 'cors' });
      const blob = await resp.blob();
      const file = new File([blob], name, { type: 'video/mp4' });
      if (navigator.canShare?.({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (_) {}
  }

  // Standard download via proxy
  const proxy = `${API}/api/dl?url=${encodeURIComponent(cdn)}&filename=${encodeURIComponent(name)}`;
  const a = document.createElement('a');
  a.href = proxy;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// ── Events ──
parseBtn.addEventListener('click', parseVideo);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') parseVideo(); });
dlBtn.addEventListener('click', download);
urlInput.focus();
</script>
</body>
</html>
